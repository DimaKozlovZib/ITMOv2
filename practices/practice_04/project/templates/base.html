<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Вайбкод-донесения{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/modern-normalize@2.0.0/modern-normalize.css" />
    <style>
      :root {
        --bg: #0f1222;
        --surface: #171a2b;
        --text: #e8eaf6;
        --muted: #b3b7ce;
        --primary: #8ab4ff;
        --accent: #ff8ace;
        --danger: #ff6b6b;
      }
      body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      nav a { color: var(--muted); text-decoration: none; margin-right: 12px; }
      nav a.active, nav a:hover { color: var(--primary); }
      .card { background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      h1, h2, h3 { margin: 0 0 12px; }
      .muted { color: var(--muted); }
      form { display: grid; gap: 12px; }
      label { font-weight: 600; }
      input[type="text"], textarea, select { width: 100%; background: var(--surface); color: var(--text); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 12px; }
      textarea { min-height: 120px; resize: vertical; }
      .actions { display: flex; gap: 12px; align-items: center; }
      button { background: var(--primary); color: #0b1020; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
      button.secondary { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); }
      .flash { padding: 10px 12px; border-radius: 8px; background: #25161a; color: #ffb3bd; border: 1px solid rgba(255,0,0,0.25); }
      ul.list { list-style: none; padding: 0; margin: 0; }
      ul.list li { border-bottom: 1px dashed rgba(255,255,255,0.08); padding: 10px 0; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; color: #0b1020; }
      .pill.low { background: #9be7a8; }
      .pill.medium { background: #ffd166; }
      .pill.high { background: #ff8a80; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div><strong>Анти-вайбкод</strong> <span class="muted">форма</span></div>
        <nav>
          <a href="/" class="{% if request.path == '/' %}active{% endif %}">Форма</a>
          <a href="/reports" class="{% if request.path.startswith('/reports') %}active{% endif %}">Заявки</a>
        </nav>
      </header>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="card" style="margin-bottom: 16px;">
            {% for category, message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
  </html>
